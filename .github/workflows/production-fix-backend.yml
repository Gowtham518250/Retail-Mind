# Trigger verified backend production-fix run.
name: Apply Backend Production Fixes

on:
  push:
    branches:
      - production-fix-2026-08-18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[backend-production-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-fix-2026-08-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch invoice synchronization
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'PATCH TARGET NOT FOUND: {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          replace('invoices_billing.py', '''        if data.line_items and len(data.line_items) > 0:\n            computed_subtotal = sum(\n                Decimal(str(item.quantity)) * Decimal(str(item.unit_price))\n                for item in data.line_items\n            )\n            tolerance = max(Decimal("0.5"), computed_subtotal * Decimal("0.01"))\n            if abs(computed_subtotal - sub_t) > tolerance:\n                raise HTTPException(\n                    status_code=400,\n                    detail=(\n                        f"Invoice total mismatch: line items sum to {computed_subtotal}, "\n                        f"but total_amount - tax = {sub_t}. Please recalculate."\n                    )\n                )\n''', '''        if data.line_items and len(data.line_items) > 0:\n            computed_subtotal = sum(\n                Decimal(str(item.quantity)) * Decimal(str(item.unit_price))\n                for item in data.line_items\n            )\n            tolerance = max(Decimal("0.5"), computed_subtotal * Decimal("0.01"))\n            if abs(computed_subtotal - sub_t) > tolerance and Decimal(str(data.tax)) == 0:\n                implied_tax = Decimal(str(data.total_amount)) - computed_subtotal\n                if implied_tax >= 0:\n                    sub_t = computed_subtotal\n                else:\n                    raise HTTPException(status_code=400, detail="Invoice total cannot be below line-item subtotal")\n            elif abs(computed_subtotal - sub_t) > tolerance:\n                raise HTTPException(\n                    status_code=400,\n                    detail=(\n                        f"Invoice total mismatch: line items sum to {computed_subtotal}, "\n                        f"but total_amount - tax = {sub_t}. Please recalculate."\n                    )\n                )\n''')
          replace('invoices_billing.py','            tax=data.tax,\n            total_amount=data.total_amount,','            tax=float(Decimal(str(data.total_amount)) - Decimal(str(sub_t))),\n            total_amount=data.total_amount,')
          replace('invoices_billing.py', '''    if data.line_items and len(data.line_items) > 0:\n        computed_subtotal = sum(\n            Decimal(str(item.quantity)) * Decimal(str(item.unit_price))\n            for item in data.line_items\n        )\n        tolerance = max(Decimal("0.5"), computed_subtotal * Decimal("0.01"))\n        if abs(computed_subtotal - sub_t2) > tolerance:\n            raise HTTPException(\n                status_code=400,\n                detail=(\n                    f"Invoice total mismatch: line items sum to {computed_subtotal}, "\n                    f"but total_amount - tax = {sub_t2}. Please recalculate."\n                )\n            )\n''', '''    if data.line_items and len(data.line_items) > 0:\n        computed_subtotal = sum(\n            Decimal(str(item.quantity)) * Decimal(str(item.unit_price))\n            for item in data.line_items\n        )\n        tolerance = max(Decimal("0.5"), computed_subtotal * Decimal("0.01"))\n        if abs(computed_subtotal - sub_t2) > tolerance and Decimal(str(data.tax)) == 0:\n            implied_tax = Decimal(str(data.total_amount)) - computed_subtotal\n            if implied_tax >= 0:\n                sub_t2 = computed_subtotal\n        elif abs(computed_subtotal - sub_t2) > tolerance:\n            raise HTTPException(\n                status_code=400,\n                detail=(\n                    f"Invoice total mismatch: line items sum to {computed_subtotal}, "\n                    f"but total_amount - tax = {sub_t2}. Please recalculate."\n                )\n            )\n''')
          replace('invoices_billing.py','        tax=data.tax,\n        total_amount=data.total_amount,','        tax=float(Decimal(str(data.total_amount)) - Decimal(str(sub_t2))),\n        total_amount=data.total_amount,')
      - name: Validate Python sources
        run: python -m compileall -q .
      - name: Commit verified backend fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invoices_billing.py .github/workflows/production-fix-backend.yml
          git rm -f .github/workflows/production-fix-backend.yml
          git commit -m "Fix invoice tax synchronization and persistence [backend-production-fix-applied]"
          git push origin production-fix-2026-08-18
