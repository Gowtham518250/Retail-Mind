name: Order Audit Realtime CI

on:
  push:
    branches:
      - "production-order-audit-*"
  pull_request:
    branches:
      - "production-fix-2026-08-18"
      - "main"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile online-order and audit modules
        run: |
          python -m py_compile online_store.py audit_logging.py realtime.py app.py
      - name: Run realtime isolation tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_realtime.py
