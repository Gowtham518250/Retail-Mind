name: Expose invoice discount metadata
on:
  push:
    branches: [production-fix-2026-08-18]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[response-discount-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-fix-2026-08-18
          fetch-depth: 0
      - name: Patch response model
        shell: python
        run: |
          from pathlib import Path
          p=Path('invoices_billing.py')
          s=p.read_text(encoding='utf-8')
          old='''class InvoiceLineItemResponse(BaseModel):\n    id: int\n    product_id: Optional[int]\n    description: Optional[str]\n    quantity: int\n    unit_price: float\n    line_total: float'''
          new='''class InvoiceLineItemResponse(BaseModel):\n    id: int\n    product_id: Optional[int]\n    description: Optional[str]\n    quantity: int\n    unit_price: float\n    discount_amount: float = 0\n    line_total: float'''
          if old not in s:
              raise SystemExit('InvoiceLineItemResponse target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add invoices_billing.py
          git commit -m 'Expose invoice discount metadata [response-discount-fix-applied]'
          git push origin production-fix-2026-08-18
