name: Realtime Feature CI

on:
  push:
    branches:
      - "production-realtime-orders-*"
  pull_request:
    branches:
      - "production-fix-2026-08-18"
      - "main"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-realtime-secret-key-for-tests-only-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile realtime backend
        run: python -m compileall -q realtime.py online_store.py app.py
      - name: Run realtime tests
        run: PYTHONPATH=. pytest -q tests/test_realtime.py
