name: Repair frontend-web npm lockfile

on:
  push:
    branches:
      - fix/frontend-web-npm-lockfile-oct-2026

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate lockfile from package.json
        working-directory: frontend-web
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify clean install against regenerated lockfile
        working-directory: frontend-web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove temporary repair workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_repair-frontend-web-lockfile-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-web/package-lock.json
          git add -u .github/workflows/_repair-frontend-web-lockfile-temp.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "fix(frontend-web): regenerate npm lockfile [skip ci]"
          git push origin HEAD
