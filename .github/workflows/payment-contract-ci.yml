name: Payment Contract CI

on:
  push:
    branches:
      - "production-payment-contract-*"
  pull_request:
    branches:
      - "production-fix-2026-08-18"
      - "main"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile payment and realtime modules
        run: |
          python -m py_compile invoices_billing.py realtime.py app.py models.py
      - name: Run payment contract tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_payment_contract.py tests/test_realtime.py
