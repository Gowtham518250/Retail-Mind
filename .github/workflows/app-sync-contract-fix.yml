name: Apply sync contract fixes
on:
  push:
    branches: [production-fix-2026-08-18]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sync-contract-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-fix-2026-08-18
          fetch-depth: 0
      - name: Apply frontend sync fixes
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'TARGET NOT FOUND: {path}: {old[:160]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Canonical backend route is /api/purchase-orders. One PO screen was
          # using /purchase-orders, so it was hitting a different/nonexistent route.
          replace('lib/purchase_orders_page.dart', "ApiClient.getJson('/purchase-orders/')", "ApiClient.getJson('/api/purchase-orders/')")
          replace('lib/purchase_orders_page.dart', "ApiClient.postJson('/purchase-orders/$poId/mark-delivered', {})", "ApiClient.postJson('/api/purchase-orders/$poId/mark-delivered', {})")
          replace('lib/purchase_orders_page.dart', "ApiClient.postJson('/purchase-orders/$poId/cancel', {})", "ApiClient.postJson('/api/purchase-orders/$poId/cancel', {})")
          replace('lib/sync_service.dart', "ApiClient.postJson('/purchase-orders/', payload, headers: {'Authorization': 'Bearer $token'})", "ApiClient.postJson('/api/purchase-orders/', payload, headers: {'Authorization': 'Bearer $token'})")
          replace('lib/sync_service.dart', "ApiClient.postJson(\n        '/purchase-orders/$poId/$action',", "ApiClient.postJson(\n        '/api/purchase-orders/$poId/$action',")

          # Preserve discount metadata when it exists on a sale line item.
          replace('lib/sale_service.dart', "if (item['discount'] != null) 'discount': item['discount'],", "if (item['discount'] != null) 'discount': item['discount'],\n      if (item['discount_amount'] != null) 'discount_amount': item['discount_amount'],")
          replace('lib/sale_service.dart', "'line_items': lineItems,", "'line_items': lineItems,")

          # Ensure the alternate PO screen uses the same canonical route.
          replace('lib/purchase_order_page.dart', "'/api/purchase-orders'", "'/api/purchase-orders'")

      - name: Commit frontend fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          git commit -m 'Fix purchase order and discount sync [sync-contract-fix-applied]' || true
          git push origin production-fix-2026-08-18
