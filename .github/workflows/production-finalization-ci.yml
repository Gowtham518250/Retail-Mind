name: Production Finalization CI

on:
  push:
    branches:
      - "production-finalization-*"
      - "production-fix-2026-08-18-playstore"
  pull_request:
    branches:
      - "production-fix-2026-08-18"
      - "production-fix-2026-08-18-playstore"
      - "main"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retail_mind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retail_mind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retail_mind_test?sslmode=disable
      SECRET_KEY: ci-password-reset-secret-key-for-tests-only-1234567890
      GROQ_API_KEY: ci-groq-api-key-not-used-by-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production modules
        run: |
          python -m py_compile             app.py             models.py             durable_sync.py             query_retrival.py query_safety.py query_answering.py             speech_service/app.py             invoices_billing.py             inventory.py             inventory_sync_service.py             online_store.py             growth_suite.py             backup_recovery.py             realtime.py             audit_logging.py             production_boot.py purchase_orders.py retail_intelligence.py tools/ai_query_eval.py tools/staging_config.py tools/run_staging_ai_eval.py
      - name: Validate Alembic migration graph
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '^030_regular_cash_paid_state')"
          test "$count" -eq 1
          head_count="$(printf '%s\n' "$heads" | grep -c '(head)')"
          test "$head_count" -eq 1
      - name: Run focused production tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_realtime.py
          pytest -q tests/test_durable_sync.py
          pytest -q tests/test_ai_query_history_contract.py
          pytest -q tests/test_query_retrieval_quality.py
          pytest -q tests/test_query_date_scope_contract.py
          pytest -q tests/test_customer_otp_password_reset.py
          pytest -q tests/test_growth_suite.py
          pytest -q tests/test_voice_query_contract.py
          pytest -q tests/test_product_discovery_contract.py
          pytest -q tests/test_voice_billing_parse_contract.py
          pytest -q tests/test_inventory_upload_ai_contract.py
          pytest -q tests/test_purchase_order_recommendations_contract.py
          pytest -q tests/test_order_idempotency_contract.py
          pytest -q tests/test_invoice_replay_guard.py
          pytest -q tests/test_purchase_order_receiving.py
          pytest -q tests/test_payment_contract.py
          pytest -q tests/test_ai_query_eval.py
          pytest -q tests/test_staging_safety.py
          pytest -q tests/test_sync_resilience.py
          pytest -q tests/test_bank_reconciliation_contract.py
          pytest -q tests/test_financial_integrity.py
          pytest -q tests/test_product_image_contract.py
          pytest -q tests/test_attendance_auto_checkout_contract.py
          pytest -q tests/test_query_retrieval_optimization.py
          pytest -q tests/test_query_safety.py
          pytest -q tests/test_query_answering.py
          pytest -q tests/test_worker_payroll_query_contract.py
          pytest -q tests/test_customer_phone_normalization.py

  customer-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build customer web
        run: npm run build


  staging-ai-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only evaluator dependencies
        run: python -m pip install --upgrade requests sqlglot
      - name: Check whether dedicated staging is configured
        id: staging
        shell: bash
        run: |
          if [[ -n "$STAGING_BASE_URL" && -n "$STAGING_TEST_EMAIL" && -n "$STAGING_TEST_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped staging test
        if: steps.staging.outputs.enabled != 'true'
        run: echo "::notice::Staging AI accuracy test skipped. Configure STAGING_BASE_URL, STAGING_TEST_EMAIL, and STAGING_TEST_PASSWORD Actions secrets to enable it."
      - name: Compare AI answers against canonical staging invoices
        if: steps.staging.outputs.enabled == 'true'
        run: |
          python tools/run_staging_ai_eval.py \
            --output staging-ai-eval.json \
            --min-critical-pass-rate 1.0 \
            --min-answer-accuracy 1.0 \
            --min-shop-scope-accuracy 1.0 \
            --min-date-range-accuracy 1.0 \
            --min-source-precision 1.0 \
            --min-source-recall 1.0
      - name: Upload sanitized staging evidence
        if: always() && steps.staging.outputs.enabled == 'true' && hashFiles('staging-ai-eval.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: staging-ai-evaluation
          path: staging-ai-eval.json
          if-no-files-found: error
