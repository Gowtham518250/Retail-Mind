name: Production Finalization CI

on:
  push:
    branches:
      - "production-finalization-*"
      - "production-fix-2026-08-18-playstore"
  pull_request:
    branches:
      - "production-fix-2026-08-18"
      - "production-fix-2026-08-18-playstore"
      - "main"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retail_mind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retail_mind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retail_mind_test?sslmode=disable
      SECRET_KEY: ci-password-reset-secret-key-for-tests-only-1234567890
      GROQ_API_KEY: ci-groq-api-key-not-used-by-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production modules
        run: |
          python -m py_compile             app.py             models.py             durable_sync.py             query_retrival.py             speech_service/app.py             invoices_billing.py             inventory_sync_service.py             online_store.py             growth_suite.py             backup_recovery.py             realtime.py             audit_logging.py             production_boot.py
      - name: Validate Alembic migration graph
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '^024_customer_sync_feed')"
          test "$count" -eq 1
      - name: Run focused production tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_realtime.py
          pytest -q tests/test_durable_sync.py
          pytest -q tests/test_customer_otp_password_reset.py
          pytest -q tests/test_growth_suite.py
          pytest -q tests/test_voice_query_contract.py
          pytest -q tests/test_attendance_auto_checkout_contract.py

  customer-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build customer web
        run: npm run build
