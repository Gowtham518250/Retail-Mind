name: Production Finalization CI

on:
  push:
    branches:
      - "production-finalization-*"
      - "production-fix-2026-08-18-playstore"
  pull_request:
    branches:
      - "production-fix-2026-08-18"
      - "production-fix-2026-08-18-playstore"
      - "main"


permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  open-source-vulnerability-scan:
    name: Open-source dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Scan repository lockfiles and manifests
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            .

  lockfile-integrity:
    name: Verify lockfile consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify root pnpm lockfile without modifying the branch
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit pinned production dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Audit pinned test dependencies
        run: pip-audit -r requirements-dev.txt --progress-spinner off

  node-dependency-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        working-directory: [frontend, frontend-web]
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.working-directory }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Fail on high or critical npm advisories
        run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retail_mind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retail_mind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retail_mind_test?sslmode=disable
      SECRET_KEY: ci-password-reset-secret-key-for-tests-only-1234567890
      GROQ_API_KEY: ci-groq-api-key-not-used-by-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile production modules
        run: |
          python -m py_compile             app.py             auth_routes.py session_routes.py security.py rate_limiter.py host_validation.py db_pool_config.py             distributed_job_lock.py             health_routes.py             models.py             durable_sync.py             query_retrival.py query_safety.py query_answering.py             speech_service/app.py             invoices_billing.py             inventory.py             inventory_sync_service.py             online_store.py             growth_suite.py             backup_recovery.py             realtime.py             audit_logging.py             production_boot.py purchase_orders.py retail_intelligence.py tools/ai_query_eval.py tools/staging_config.py tools/run_staging_ai_eval.py
      - name: Validate Alembic migration graph
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          count="$(echo "$heads" | grep -c '^039_payment_idempotency_key')"
          test "$count" -eq 1
          head_count="$(echo "$heads" | grep -c '(head)')"
          test "$head_count" -eq 1
      - name: Apply migrations to an empty test database
        run: |
          alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["DATABASE_URL"])
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          required_tables = {
              "user_details",
              "sales",
              "products",
              "customers",
              "invoices",
              "invoice_line_items",
              "payments",
              "online_orders",
              "online_customers",
              "online_order_delivery_otps",
              "email_otp_challenges",
              "shop_reviews",
              "workers",
          }
          missing = sorted(required_tables - tables)
          if missing:
              raise SystemExit(f"Fresh schema is missing required tables: {missing}")

          sales_columns = {item["name"] for item in inspector.get_columns("sales")}
          if "reference_order_id" not in sales_columns:
              raise SystemExit("Fresh sales schema is missing reference_order_id")

          payments_columns = {item["name"] for item in inspector.get_columns("payments")}
          if "idempotency_key" not in payments_columns:
              raise SystemExit("Fresh payments schema is missing idempotency_key")
          payment_indexes = inspector.get_indexes("payments")
          if not any(
              index.get("unique")
              and index.get("column_names") == ["idempotency_key"]
              for index in payment_indexes
          ):
              raise SystemExit("Fresh payments schema is missing the unique idempotency index")

          print("Fresh database migration smoke test passed.")
          PY
      - name: Run focused production tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_owner_password_reset_security.py
          pytest -q tests/test_realtime.py
          pytest -q tests/test_durable_sync.py
          pytest -q tests/test_ai_query_history_contract.py
          pytest -q tests/test_query_retrieval_quality.py
          pytest -q tests/test_sales_analytics_regression.py
          pytest -q tests/test_query_date_scope_contract.py
          pytest -q tests/test_customer_otp_password_reset.py
          pytest -q tests/test_access_token_boundaries.py
          pytest -q tests/test_render_host_validation.py
          pytest -q tests/test_performance_middleware.py
          pytest -q tests/test_generic_email_otp.py
          pytest -q tests/test_owner_otp_attempts.py
          pytest -q tests/test_security_distributed_rate_limit.py
          pytest -q tests/test_growth_suite.py
          pytest -q tests/test_voice_query_contract.py
          pytest -q tests/test_product_discovery_contract.py
          pytest -q tests/test_voice_billing_parse_contract.py
          pytest -q tests/test_inventory_upload_ai_contract.py
          pytest -q tests/test_purchase_order_recommendations_contract.py
          pytest -q tests/test_order_idempotency_contract.py
          pytest -q tests/test_rate_limiter_redis_recovery.py
          pytest -q tests/test_invoice_replay_guard.py
          pytest -q tests/test_purchase_order_receiving.py
          pytest -q tests/test_database_url.py
          pytest -q tests/test_payment_contract.py
          pytest -q tests/test_ai_query_eval.py
          pytest -q tests/test_staging_safety.py
          pytest -q tests/test_sync_resilience.py
          pytest -q tests/test_bank_reconciliation_contract.py
          pytest -q tests/test_financial_integrity.py
          pytest -q tests/test_product_image_contract.py
          pytest -q tests/test_render_host_validation.py
          pytest -q tests/test_root_head_probe.py
          pytest -q tests/test_db_pool_config.py
          pytest -q tests/test_db_diagnostics.py
          pytest -q tests/test_owner_order_analytics.py
          pytest -q tests/test_health_routes.py
          pytest -q tests/test_cache_manager_resilience.py
          pytest -q tests/test_distributed_job_lock.py
          pytest -q tests/test_attendance_auto_checkout_contract.py
          pytest -q tests/test_query_retrieval_optimization.py
          pytest -q tests/test_query_safety.py
          pytest -q tests/test_query_answering.py
          pytest -q tests/test_worker_payroll_query_contract.py
          pytest -q tests/test_customer_phone_normalization.py
          pytest -q tests/test_invoice_sync_payment_state.py

  customer-web:
    runs-on: ubuntu-latest
    env:
      # Safe placeholder only for build-time validation; it is not a deployed target.
      NEXT_PUBLIC_API_URL: https://api.invalid
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build customer web
        run: npm run build


  staging-ai-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install read-only evaluator dependencies
        run: python -m pip install --upgrade requests sqlglot
      - name: Check whether dedicated staging is configured
        id: staging
        shell: bash
        run: |
          if [[ -n "$STAGING_BASE_URL" && -n "$STAGING_TEST_EMAIL" && -n "$STAGING_TEST_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require staging configuration
        if: steps.staging.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "::error::Release validation requires STAGING_BASE_URL, STAGING_TEST_EMAIL, and STAGING_TEST_PASSWORD in GitHub Actions secrets. The staging AI evaluation cannot be skipped for this release workflow."
          exit 1
      - name: Compare AI answers against canonical staging invoices
        if: steps.staging.outputs.enabled == 'true'
        run: |
          python tools/run_staging_ai_eval.py \
            --output staging-ai-eval.json \
            --min-critical-pass-rate 1.0 \
            --min-answer-accuracy 1.0 \
            --min-shop-scope-accuracy 1.0 \
            --min-date-range-accuracy 1.0 \
            --min-source-precision 1.0 \
            --min-source-recall 1.0
      - name: Upload sanitized staging evidence
        if: always() && steps.staging.outputs.enabled == 'true' && hashFiles('staging-ai-eval.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: staging-ai-evaluation
          path: staging-ai-eval.json
          if-no-files-found: error
