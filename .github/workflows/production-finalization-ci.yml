name: Production Finalization CI

on:
  push:
    branches:
      - "production-finalization-*"
  pull_request:
    branches:
      - "production-fix-2026-08-18"
      - "main"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production modules
        run: |
          python -m py_compile             app.py             invoices_billing.py             inventory_sync_service.py             online_store.py             backup_recovery.py             realtime.py             audit_logging.py
      - name: Run focused realtime/inventory tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_realtime.py
