name: One-time Retail Mind timezone patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[retail-mind-timezone-patch-done]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply local timezone fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          for p in Path('.').rglob('*.py'):
              if any(part in {'.git', '.venv', 'venv', '__pycache__'} for part in p.parts):
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue

              if '_local_now' not in s:
                  continue

              original = s
              s = s.replace('today = date.today()', 'today = _local_now().date()')
              s = s.replace('cutoff_date = date.today() - timedelta(days=days)', 'cutoff_date = _local_now().date() - timedelta(days=days)')

              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          if not changed:
              raise SystemExit('No timezone occurrences found in files that define _local_now()')
          print('Patched:', *changed, sep='\n  ')

          wf = Path('.github/workflows/one_time_timezone_patch.yml')
          if wf.exists():
              wf.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use local business date for analytics [retail-mind-timezone-patch-done]'
          git push