name: Production CI/CD

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retail_mind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retail_mind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retail_mind_test?sslmode=disable
      SECRET_KEY: ci-password-reset-secret-key-for-tests-only-1234567890
      GROQ_API_KEY: ci-groq-api-key-not-used-by-tests
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile sync and financial modules
        run: |
          python -m py_compile app.py models.py durable_sync.py invoices_billing.py attendance.py production_boot.py realtime.py
      - name: Test focused production contracts
        run: |
          pytest -q tests/test_realtime.py
          pytest -q tests/test_durable_sync.py
          pytest -q tests/test_customer_otp_password_reset.py
          pytest -q tests/test_growth_suite.py
          pytest -q tests/test_voice_query_contract.py
          pytest -q tests/test_attendance_auto_checkout_contract.py

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Customer web build is exercised by Production Finalization CI.
