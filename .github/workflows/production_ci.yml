name: Production CI/CD

on:
  push:
    branches: ["main", "production", "production-hardening-95"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile-check Python sources
        run: python -m compileall -q .

      - name: Run backend tests
        run: pytest tests/ -q

  # The Flutter application lives in a separate repository. This backend
  # workflow deliberately does not pretend to test Flutter code. Frontend
  # analysis/tests must run in the frontend repository's own CI pipeline.
  release-gate:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Backend release gate passed
        run: echo "Backend production CI passed. Frontend CI is maintained in new_frontend_retail_mind."
