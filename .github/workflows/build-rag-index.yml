name: Build RAG FAISS Index

on:
  workflow_dispatch:
  push:
    branches: [production-fix-2026-08-18]
    paths:
      - "business_table_catalog/**"
      - "build_faiss_index.py"
      - ".github/workflows/build-rag-index.yml"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-fix-2026-08-18
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RAG build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 onnxruntime==1.20.1 huggingface-hub==0.34.4 tokenizers==0.21.4 faiss-cpu==1.8.0 langchain-core==0.3.70 langchain-community==0.3.27 requests==2.31.0

      - name: Generate FAISS index
        run: python build_faiss_index.py

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faiss_index/index.faiss faiss_index/index.pkl rag_table_catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate production FAISS RAG index [rag-index-generated]"
          git push origin production-fix-2026-08-18
