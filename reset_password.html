<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Retail Mind</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f7fb;display:grid;place-items:center;min-height:100vh;margin:0;color:#1f2937}
    .card{max-width:480px;margin:24px;padding:30px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    a{display:inline-block;margin-top:12px;padding:11px 18px;background:#2874f0;color:#fff;text-decoration:none;border-radius:7px;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <h2>Password reset has moved to secure OTP verification</h2>
    <p>Request a fresh 6-digit OTP from your registered email and complete the reset on the customer sign-in page.</p>
    <a id="reset-link" href="/auth?view=reset">Open password reset</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || '';
    const link = document.getElementById('reset-link');
    if (email) {
      link.href = '/auth?view=reset&email=' + encodeURIComponent(email);
    }
  </script>
</body>
</html>
