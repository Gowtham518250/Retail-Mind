<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Retail Mind</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f7fb;display:grid;place-items:center;min-height:100vh;margin:0;color:#1f2937}
    .card{max-width:480px;margin:24px;padding:28px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 12px 32px rgba(15,23,42,.08)}
  </style>
</head>
<body>
  <div class="card">
    <h2>Opening secure password reset…</h2>
    <p>You will be redirected to the customer sign-in page.</p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('resetToken') || params.get('token');
      const shopId = params.get('shop_id');
      if (!token) return;
      const target = new URL('/auth', window.location.origin);
      target.searchParams.set('resetToken', token);
      if (shopId) target.searchParams.set('shop_id', shopId);
      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
