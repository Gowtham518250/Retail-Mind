services:
  - type: web
    name: retail-mind-api
    env: python
    buildCommand: "pip install -r requirements.txt && python build_faiss_index.py"
    # Keep production startup on the compatibility bootstrap; schema changes are applied by guarded migrations/bootstrap patches.
    startCommand: "alembic upgrade head && python production_boot.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Short-lived access token; the refresh token keeps an active login for 7 days.
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REALTIME_REDIS_CHANNEL
        value: retail-mind:realtime:events
      - key: REALTIME_TICKET_TTL_SECONDS
        value: "120"

  - type: static
    name: retail-mind-frontend
    env: static
    buildCommand: "cd frontend && npm ci && npm run build"
    publishPath: "frontend/dist"
    envVars:
      - key: NODE_ENV
        value: production
