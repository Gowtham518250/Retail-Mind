services:
  - type: web
    name: retail-mind-api
    env: python
    healthCheckPath: /health/ready
    buildCommand: "pip install -r requirements.txt && python build_faiss_index.py"
    # Run schema changes once before any newly deployed instance receives traffic.
    preDeployCommand: "python predeploy_db.py"
    # production_app.py only imports/serves the already-prepared FastAPI application.
    startCommand: "gunicorn --config gunicorn.conf.py production_app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Short-lived access token; the refresh token keeps an active login for 7 days.
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REALTIME_REDIS_CHANNEL
        value: retail-mind:realtime:events
      - key: REALTIME_TICKET_TTL_SECONDS
        value: "120"
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: RETAIL_MIND_AGENT_ENABLED
        value: "false"
      - key: RETAIL_MIND_AGENT_MODEL
        value: openai/gpt-oss-120b
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: SARVAM_TTS_SPEAKER
        value: shubh
      - key: RETAIL_MIND_MCP_ENABLED
        value: "false"
      - key: RETAIL_MIND_MCP_ALLOWED_HOSTS
        sync: false
      - key: RETAIL_MIND_MCP_ALLOWED_ORIGINS
        sync: false
